complete_item:
  fields:
    item_id:
      required: true
      selector:
        text:
reopen_item:
  fields:
    item_id:
      required: true
      selector:
        text:
remove_item:
  fields:
    item_id:
      required: true
      selector:
        text:
add_item:
  fields:
    text:
      required: true
      selector:
        text:
update_item:
  fields:
    item_id:
      required: true
      selector:
        text:
    name:
      selector:
        text:
    quantity:
      selector:
        number:
          min: 1
          max: 99
          mode: box
    category:
      selector:
        select:
          translation_key: category
          options:
            - produce
            - bread
            - meat_fish
            - dairy
            - frozen
            - pantry
            - drinks
            - baby
            - care
            - household
            - other
clear_done:
open_new_can:
refresh_supply:
set_supply:
  fields:
    enabled:
      required: true
      selector:
        boolean:
    can_grams:
      required: true
      selector:
        number:
          min: 1
          max: 5000
          mode: box
          unit_of_measurement: g
    grams_per_100ml:
      required: true
      selector:
        number:
          min: 0.1
          max: 40
          step: 0.1
          mode: box
          unit_of_measurement: g
    warn_days:
      required: true
      selector:
        number:
          min: 0
          max: 14
          mode: box
    product_name:
      required: true
      selector:
        text:
    diary_entity:
      required: true
      selector:
        entity:
          domain: calendar
